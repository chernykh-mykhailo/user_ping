version: '3.8'

services:
  ping-bot:
    build: .
    image: ping_bot:latest
    container_name: ping_bot
    restart: always
    environment:
      - BOT_MODE=prod # Продакшн режим
      - TZ=Europe/Kyiv
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
      - ./.env:/app/.env
    # All session files persist here
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
