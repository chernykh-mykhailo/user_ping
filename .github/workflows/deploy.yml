name: Deploy Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy to which environment?'
        required: true
        default: 'test'
        type: choice
        options:
        - test
        - prod
        - both

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.target || 'test' }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          envs: ENV_FILE,DEPLOY_TARGET
          script: |
            set -e
            PROJECT_PATH="${{ secrets.PROJECT_PATH || '/home/ubuntu/user_ping' }}"
            
            echo "Target path: $PROJECT_PATH"
            echo "Deploying environment: $DEPLOY_TARGET"
            
            if [ ! -d "$PROJECT_PATH/.git" ]; then
              echo "Directory empty or not a git repo. Syncing..."
              mkdir -p "$PROJECT_PATH"
              cd "$PROJECT_PATH"
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              echo "Pulling latest changes..."
              cd "$PROJECT_PATH"
              # Update remote URL to include token just in case
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch --all
              git reset --hard origin/main
            fi
            
            # Restore .env file from Secrets
            echo "$ENV_FILE" > "$PROJECT_PATH/.env"
            
            # Clean up potential conflicts and restart containers
            echo "Removing old containers if they exist to prevent name conflicts..."
            docker stop my_ping_bot_prod my_ping_bot_test || true
            docker rm my_ping_bot_prod my_ping_bot_test || true
            
            echo "Restarting containers for: $DEPLOY_TARGET"
            
            if [ "$DEPLOY_TARGET" == "test" ]; then
              docker compose -p user-ping-test -f docker-compose-test.yml up -d --build
            elif [ "$DEPLOY_TARGET" == "prod" ]; then
              docker compose -p user-ping-prod -f docker-compose.yml up -d --build
            else
              # Both
              docker compose -p user-ping-prod -f docker-compose.yml up -d --build
              docker compose -p user-ping-test -f docker-compose-test.yml up -d --build
            fi
            
            docker image prune -f
            echo "Deployment to $DEPLOY_TARGET finished successfully!"
