name: Deploy Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          envs: ENV_FILE
          script: |
            set -e
            PROJECT_PATH="${{ secrets.PROJECT_PATH || '/root/projects/mafia/user_ping' }}"
            
            echo "Target path: $PROJECT_PATH"
            
            if [ ! -d "$PROJECT_PATH/.git" ]; then
              echo "Directory empty or not a git repo. Syncing..."
              mkdir -p "$PROJECT_PATH"
              cd "$PROJECT_PATH"
              git clone https://github.com/${{ github.repository }}.git .
            else
              echo "Pulling latest changes..."
              cd "$PROJECT_PATH"
              git pull origin main
            fi
            
            # Restore .env file from Secrets
            echo "$ENV_FILE" > "$PROJECT_PATH/.env"
            
            echo "Restarting containers..."
            # Try both docker compose (v2) and docker-compose (v1)
            if docker compose version > /dev/null 2>&1; then
              docker compose -f docker-compose-prod.yml up -d --build
              docker compose up -d --build
            else
              docker-compose -f docker-compose-prod.yml up -d --build
              docker-compose up -d --build
            fi
            
            docker image prune -f
            echo "Deployment finished successfully!"
