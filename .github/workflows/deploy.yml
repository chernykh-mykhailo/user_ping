name: Deploy Bot

on:
  push:
    branches:
      - main  # або master, залежно від вашої гілки

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /path/to/your/bot  # ТУТ ТРЕБА ВКАЗАТИ ШЛЯХ ДО БОТА НА СЕРВЕРІ
            git pull origin main
            docker compose -f docker-compose-prod.yml up -d --build
            docker image prune -f  # Очистити старі образи, щоб не займали місце
