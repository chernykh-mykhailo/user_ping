name: Deploy Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy to which environment?'
        required: true
        default: 'test'
        type: choice
        options:
        - test
        - prod
        - both

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.target || 'test' }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          envs: ENV_FILE,DEPLOY_TARGET
          script: |
            set -e
            PROJECT_PATH="${{ secrets.PROJECT_PATH || '/home/ubuntu/user_ping' }}"
            
            echo "Target path: $PROJECT_PATH"
            echo "Deploying environment: $DEPLOY_TARGET"
            
            if [ ! -d "$PROJECT_PATH/.git" ]; then
              echo "Directory empty or not a git repo. Syncing..."
              mkdir -p "$PROJECT_PATH"
              cd "$PROJECT_PATH"
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              echo "Pulling latest changes..."
              cd "$PROJECT_PATH"
              # Update remote URL to include token just in case
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch --all
              git reset --hard origin/main
            fi
            
            # Restore .env file from Secrets
            echo "$ENV_FILE" > "$PROJECT_PATH/.env"
            
            # Clean up potential conflicts and restart containers for the specific target
            # Comprehensive list of old/long names to clean up once
            OLD_NAMES="my_ping_bot_prod my_ping_bot_test user_ping-ping-bot-1 user_ping-ping-bot-test-1 user-ping-prod-ping-bot-1 user-ping-test-ping-bot-test-1"
            
            if [ "$DEPLOY_TARGET" == "test" ]; then
              echo "Restarting TEST environment (ping_test)..."
              docker stop ping_test $OLD_NAMES || true
              docker rm ping_test $OLD_NAMES || true
              docker compose -p ping-test -f docker-compose-test.yml up -d --build
            elif [ "$DEPLOY_TARGET" == "prod" ]; then
              echo "Restarting PROD environment (ping_bot)..."
              docker stop ping_bot $OLD_NAMES || true
              docker rm ping_bot $OLD_NAMES || true
              docker compose -p ping-prod -f docker-compose.yml up -d --build
            else
              # Both
              echo "Restarting BOTH environments (ping_bot & ping_test)..."
              docker stop ping_bot ping_test $OLD_NAMES || true
              docker rm ping_bot ping_test $OLD_NAMES || true
              docker compose -p ping-prod -f docker-compose.yml up -d --build
              docker compose -p ping-test -f docker-compose-test.yml up -d --build
            fi
            
            docker image prune -f
            echo "Deployment to $DEPLOY_TARGET finished successfully!"
