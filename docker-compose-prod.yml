services:
  ping-bot:
    build: .
    container_name: my_ping_bot_prod
    restart: always
    environment:
      - BOT_MODE=prod # Продакшн режим
    volumes:
      - ./users_data.json:/app/users_data.json
      - ./backups:/app/backups
      - ./account2_session.session:/app/account2_session.session
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
