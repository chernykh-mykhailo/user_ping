services:
  ping-bot-test:
    build: .
    container_name: my_ping_bot_test
    restart: always
    environment:
      - BOT_MODE=test # Тестовий режим
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./.env:/app/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
